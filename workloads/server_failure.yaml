# Server 4 dies for 1 s across round 2: backoff and recovery without wasted overhead.
id: server_failure
seed: 1
drain_s: 4
flows:
  - pattern: incast
    src: "sender*"
    dst: "receiver*"
    exclude_self: true
    direction: allreduce
    start_s: 1.0
    period_s: 2.0
    rounds: 5
    burst_bytes: 28000
    msg_bytes: 1400
    deadline_s: 1.5
events:
  - {t_s: 2.95, kind: blackout, target: "sender4-rack1", duration_s: 1.0}
  - {t_s: 2.95, kind: blackout, target: "rack1-receiver4", duration_s: 1.0}
