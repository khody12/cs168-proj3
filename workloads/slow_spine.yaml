# rack1-spine drops to 75 Mbps: feedback must correct a wrong prior.
id: slow_spine
seed: 1
drain_s: 4
flows:
  - pattern: incast
    src: "sender*"
    dst: "receiver*"
    exclude_self: true
    direction: allreduce
    start_s: 1.0
    period_s: 2.0
    rounds: 5
    burst_bytes: 28000
    msg_bytes: 1400
    deadline_s: 1.5
events:
  - {t_s: 0.5, kind: bw_change, target: "rack1-spine", bw_mbps: 75}
